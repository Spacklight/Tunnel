<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Gini AI</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #0f0a2e 0%, #1a1147 30%, #2d1b69 60%, #3d1f7a 100%);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    background: rgba(15, 10, 46, 0.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding: env(safe-area-inset-top, 0) 16px 12px 16px;
    padding-top: calc(env(safe-area-inset-top, 0) + 12px);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .logo { display: flex; align-items: center; gap: 8px; }
  .logo-icon {
    width: 28px; height: 28px;
    background: linear-gradient(135deg, #6d5bff 0%, #d946ef 100%);
    border-radius: 50% 50% 50% 8px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 12px rgba(217, 70, 239, 0.5);
    flex-shrink: 0;
  }
  .logo-icon svg { width: 16px; height: 16px; }
  .logo h1 {
    font-size: 17px; margin: 0;
    background: linear-gradient(90deg, #fff, #d9c9ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    font-weight: 700;
  }
  #statusDot {
    width: 8px; height: 8px; border-radius: 50%; background: #6b7280;
    display: inline-block; margin-right: 6px;
  }
  #statusDot.online { background: #34d399; box-shadow: 0 0 6px #34d399; }
  #statusDot.offline { background: #f87171; }
  #statusText { font-size: 12px; color: #b8aee0; }

  #chatArea {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 16px; max-width: 700px; width: 100%; margin: 0 auto;
  }
  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; height: 100%; color: #b8aee0; padding: 20px;
  }
  .empty-state .mascot {
    width: 72px; height: 72px;
    background: linear-gradient(135deg, #6d5bff 0%, #d946ef 100%);
    border-radius: 50% 50% 50% 12px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 30px rgba(217, 70, 239, 0.4);
    margin-bottom: 16px;
  }
  .empty-state .mascot svg { width: 40px; height: 40px; }
  .empty-state h2 { color: #fff; font-size: 20px; margin: 0 0 6px 0; }
  .empty-state p { font-size: 13px; margin: 0; color: #9d90c9; }

  .msg {
    max-width: 85%; padding: 10px 14px; border-radius: 14px; margin-bottom: 10px;
    font-size: 15px; white-space: pre-wrap; line-height: 1.45; word-wrap: break-word;
  }
  .msg.user {
    background: linear-gradient(135deg, #6d5bff 0%, #9333ea 100%);
    color: #fff; margin-left: auto; border-bottom-right-radius: 3px;
    box-shadow: 0 2px 10px rgba(109, 91, 255, 0.3);
  }
  .msg.ai {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
    color: #f0ecff; margin-right: auto; border-bottom-left-radius: 3px;
    backdrop-filter: blur(6px); max-width: 92%;
  }
  .msg.ai.streaming .cursor::after {
    content: "▍"; color: #d946ef; animation: blink 1s step-start infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .thinking { display: inline-flex; align-items: center; gap: 4px; padding: 2px 0; }
  .thinking span {
    width: 6px; height: 6px; border-radius: 50%; background: #d946ef;
    animation: pulse 1.2s infinite ease-in-out;
  }
  .thinking span:nth-child(2) { animation-delay: 0.2s; }
  .thinking span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse {
    0%, 60%, 100% { opacity: 0.3; transform: scale(0.85); }
    30% { opacity: 1; transform: scale(1); }
  }

  /* ---- Code block styling ---- */
  .code-block {
    margin: 8px 0;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.12);
    background: #14102b;
  }
  .code-block-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 10px;
    background: rgba(255,255,255,0.05);
    font-size: 12px;
    color: #b8aee0;
    font-family: -apple-system, sans-serif;
  }
  .code-block-lang { text-transform: uppercase; letter-spacing: 0.5px; }
  .code-block-actions { display: flex; gap: 6px; }
  .code-btn {
    background: rgba(217, 70, 239, 0.15);
    border: 1px solid rgba(217, 70, 239, 0.3);
    color: #e9d5ff;
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 500;
  }
  .code-btn:active { background: rgba(217, 70, 239, 0.3); }
  .code-block pre {
    margin: 0;
    padding: 12px;
    overflow-x: auto;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.5;
    color: #e5e0ff;
    white-space: pre;
  }
  .code-preview-frame {
    width: 100%;
    height: 300px;
    border: none;
    background: #fff;
    display: none;
  }
  .code-preview-frame.active { display: block; }

  form {
    display: flex; align-items: flex-end; gap: 8px;
    padding: 10px 16px; padding-bottom: calc(env(safe-area-inset-bottom, 0) + 10px);
    background: rgba(15, 10, 46, 0.85); backdrop-filter: blur(10px);
    border-top: 1px solid rgba(255,255,255,0.1);
    max-width: 700px; width: 100%; margin: 0 auto; box-sizing: border-box; flex-shrink: 0;
  }
  textarea {
    flex: 1; resize: none; border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06); color: #fff; border-radius: 10px;
    padding: 10px 12px; font-size: 16px; font-family: inherit;
    max-height: 120px; min-height: 42px;
  }
  textarea::placeholder { color: #9d90c9; }
  textarea:focus { outline: none; border-color: #d946ef; }

  button.send {
    padding: 0 18px; height: 42px;
    background: linear-gradient(135deg, #6d5bff 0%, #d946ef 100%);
    color: #fff; border: none; border-radius: 10px; cursor: pointer;
    font-size: 14px; font-weight: 600; flex-shrink: 0;
    box-shadow: 0 2px 10px rgba(217, 70, 239, 0.35);
  }
  button.send:disabled { background: #4b4570; box-shadow: none; cursor: not-allowed; }

  @media (max-width: 480px) {
    .logo h1 { font-size: 15px; }
    .msg { max-width: 92%; font-size: 14px; }
    button.send { padding: 0 14px; }
    .code-block pre { font-size: 12px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="9" cy="10" r="1.2" fill="white"/>
        <circle cx="15" cy="10" r="1.2" fill="white"/>
        <path d="M8 14C8 14 9.5 15.5 12 15.5C14.5 15.5 16 14 16 14" stroke="white" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>GiniAi</h1>
  </div>
  <span><span id="statusDot"></span><span id="statusText">Connecting...</span></span>
</header>

<div id="chatArea">
  <div class="empty-state" id="emptyState">
    <div class="mascot">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="9" cy="10" r="1.4" fill="white"/>
        <circle cx="15" cy="10" r="1.4" fill="white"/>
        <path d="M8 14C8 14 9.5 16 12 16C14.5 16 16 14 16 14" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <h2>Your Smart AI Assistant</h2>
    <p>Ask me anything to get started</p>
  </div>
</div>

<form id="chatForm">
  <textarea id="messageInput" placeholder="Message Gini AI..." rows="1"></textarea>
  <button type="submit" class="send" id="sendBtn">Send</button>
</form>

<script>
  const TUNNEL_JSON_URL = "https://raw.githubusercontent.com/Spacklight/Tunnel/main/config/tunnel.json";
  let tunnelUrl = null;

  const chatArea = document.getElementById("chatArea");
  const emptyState = document.getElementById("emptyState");
  const form = document.getElementById("chatForm");
  const input = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");
  const statusDot = document.getElementById("statusDot");
  const statusText = document.getElementById("statusText");

  function removeEmptyState() {
    if (emptyState) emptyState.remove();
  }

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // Detects ```lang ... ``` fenced blocks and text in between, and renders
  // each piece appropriately (plain text vs formatted code block).
  function renderMessageContent(container, rawText) {
    container.innerHTML = "";
    const fenceRegex = /```(\w*)\n?([\s\S]*?)```/g;
    let lastIndex = 0;
    let match;
    let blockCount = 0;

    while ((match = fenceRegex.exec(rawText)) !== null) {
      // Plain text before this code block
      if (match.index > lastIndex) {
        const textNode = document.createElement("span");
        textNode.textContent = rawText.slice(lastIndex, match.index);
        container.appendChild(textNode);
      }

      const lang = (match[1] || "code").trim();
      const code = match[2];
      blockCount++;
      const blockId = `code-${Date.now()}-${blockCount}`;

      const wrapper = document.createElement("div");
      wrapper.className = "code-block";

      const isFullHtmlPage = /<html[\s>]/i.test(code);

      wrapper.innerHTML = `
        <div class="code-block-header">
          <span class="code-block-lang">${escapeHtml(lang || "code")}</span>
          <div class="code-block-actions">
            ${isFullHtmlPage ? `<button type="button" class="code-btn" data-action="preview" data-target="${blockId}">Preview</button>` : ""}
            <button type="button" class="code-btn" data-action="copy" data-target="${blockId}">Copy</button>
          </div>
        </div>
        <pre><code id="${blockId}">${escapeHtml(code)}</code></pre>
        ${isFullHtmlPage ? `<iframe class="code-preview-frame" id="${blockId}-frame"></iframe>` : ""}
      `;
      container.appendChild(wrapper);

      lastIndex = fenceRegex.lastIndex;
    }

    // Remaining plain text after the last code block
    if (lastIndex < rawText.length) {
      const textNode = document.createElement("span");
      textNode.className = "cursor";
      textNode.textContent = rawText.slice(lastIndex);
      container.appendChild(textNode);
    } else if (blockCount === 0) {
      // No code blocks at all — whole message is plain streaming text
      const textNode = document.createElement("span");
      textNode.className = "cursor";
      textNode.textContent = rawText;
      container.appendChild(textNode);
    }
  }

  // Event delegation for Copy / Preview buttons inside any message
  chatArea.addEventListener("click", (e) => {
    const btn = e.target.closest(".code-btn");
    if (!btn) return;
    const action = btn.dataset.action;
    const targetId = btn.dataset.target;

    if (action === "copy") {
      const codeEl = document.getElementById(targetId);
      navigator.clipboard.writeText(codeEl.textContent).then(() => {
        const original = btn.textContent;
        btn.textContent = "Copied!";
        setTimeout(() => { btn.textContent = original; }, 1500);
      });
    }

    if (action === "preview") {
      const codeEl = document.getElementById(targetId);
      const frame = document.getElementById(targetId + "-frame");
      const pre = codeEl.closest("pre");
      const isActive = frame.classList.contains("active");

      if (isActive) {
        frame.classList.remove("active");
        pre.style.display = "block";
        btn.textContent = "Preview";
      } else {
        frame.srcdoc = codeEl.textContent;
        frame.classList.add("active");
        pre.style.display = "none";
        btn.textContent = "Show Code";
      }
    }
  });

  function addMessage(role, text) {
    removeEmptyState();
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    if (role === "user") {
      div.textContent = text;
    } else {
      renderMessageContent(div, text);
    }
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
    return div;
  }

  function addThinkingBubble() {
    const div = document.createElement("div");
    div.className = "msg ai";
    div.innerHTML = `<span class="thinking"><span></span><span></span><span></span></span>`;
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
    return div;
  }

  async function refreshTunnelUrl() {
    try {
      const res = await fetch(TUNNEL_JSON_URL + "?t=" + Date.now());
      const data = await res.json();
      tunnelUrl = data.url;
      statusDot.className = "online";
      statusText.textContent = "Online";
      return true;
    } catch (err) {
      statusDot.className = "offline";
      statusText.textContent = "Offline";
      return false;
    }
  }

  async function sendMessage(message) {
    addMessage("user", message);
    const aiDiv = addThinkingBubble();
    let hasStartedStreaming = false;
    let fullText = "";

    sendBtn.disabled = true;

    try {
      if (!tunnelUrl) {
        const ok = await refreshTunnelUrl();
        if (!ok) throw new Error("Could not reach tunnel");
      }

      const response = await fetch(tunnelUrl + "/chat/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message }),
      });

      if (!response.ok || !response.body) {
        throw new Error("Server did not respond");
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n\n");
        buffer = lines.pop();

        for (const line of lines) {
          if (line.startsWith("data: ")) {
            const text = line.slice(6);
            if (text === "[DONE]") continue;

            if (!hasStartedStreaming) {
              aiDiv.innerHTML = "";
              aiDiv.classList.add("streaming");
              hasStartedStreaming = true;
            }
            fullText += text;
            // Re-render on every chunk so code fences get formatted live as they complete
            renderMessageContent(aiDiv, fullText);
            chatArea.scrollTop = chatArea.scrollHeight;
          }
        }
      }
    } catch (err) {
      aiDiv.classList.remove("streaming");
      aiDiv.textContent = "Error: " + err.message + " — trying to reconnect...";
      await refreshTunnelUrl();
    } finally {
      aiDiv.classList.remove("streaming");
      sendBtn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    input.value = "";
    input.style.height = "auto";
    sendMessage(message);
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = input.scrollHeight + "px";
  });

  refreshTunnelUrl();
</script>

</body>
</html>
