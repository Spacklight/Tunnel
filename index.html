<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Transmission — MIMO + GiniAi Uplink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0f0e;
    --panel:#12181a;
    --panel-raised:#161e20;
    --panel-raised-2:#1b2426;
    --border:#223028;
    --text:#e8f0ec;
    --text-dim:#8ba39a;
    --mimo:#7aa2ff;
    --mimo-dim:#2a3a5c;
    --gini:#3ddc84;
    --gini-dim:#1c3a2e;
    --amber:#f5a623;
    --red:#ff5c5c;
    --mono:'JetBrains Mono', monospace;
    --sans:'Inter', sans-serif;
  }

  *{box-sizing:border-box;}

  html,body{ margin:0; padding:0; height:100%; background:var(--bg); color:var(--text); font-family:var(--sans); }

  body{
    background-image:repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
    display:flex; flex-direction:column;
    height:100vh;
    height:100dvh;
    overflow:hidden;
  }

  header{
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 20px; border-bottom:1px solid var(--border); background:var(--panel);
    flex-wrap:wrap; gap:10px;
  }

  .brand{ display:flex; flex-direction:column; gap:2px; }
  .brand .title{ font-family:var(--mono); font-weight:700; font-size:15px; letter-spacing:0.12em; }
  .brand .sub{ font-family:var(--mono); font-size:10px; letter-spacing:0.08em; color:var(--text-dim); }

  .status-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

  .chip{
    display:flex; align-items:center; gap:7px;
    font-family:var(--mono); font-size:11px; letter-spacing:0.06em;
    padding:6px 10px; border:1px solid var(--border); border-radius:3px; background:var(--panel-raised);
  }

  .chip .name{ font-weight:700; }
  .chip .role{ color:var(--text-dim); font-size:9.5px; }

  .dot{ width:8px; height:8px; border-radius:50%; background:var(--text-dim); flex:0 0 auto; }
  .dot.searching, .dot.working{ animation:pulse 1s ease-in-out infinite; }
  .dot.searching{ background:var(--amber); }
  .dot.working.mimo-dot{ background:var(--mimo); box-shadow:0 0 8px var(--mimo); }
  .dot.working.gini-dot{ background:var(--gini); box-shadow:0 0 8px var(--gini); }
  .dot.online{ background:var(--gini); box-shadow:0 0 8px var(--gini); }
  .dot.offline{ background:var(--red); box-shadow:0 0 8px var(--red); }
  .dot.idle{ background:var(--text-dim); }

  @keyframes pulse{ 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:0.35; transform:scale(0.8);} }
  @media (prefers-reduced-motion: reduce){ .dot.searching, .dot.working{ animation:none; } }

  main{ flex:1 1 auto; min-height:0; overflow-y:auto; padding:24px 16px 12px; display:flex; flex-direction:column; gap:16px; }

  .msg{ max-width:82%; padding:12px 15px; border-radius:8px; line-height:1.6; font-size:14.5px; white-space:pre-wrap; word-break:break-word; }

  .msg.user{ align-self:flex-end; background:#1c2a3a; border:1px solid #2a3d52; }
  .msg.mimo{ align-self:flex-start; background:var(--panel-raised); border:1px solid var(--mimo-dim); border-left:3px solid var(--mimo); width:min(82%, 640px); }
  .msg.gini{ align-self:flex-start; background:var(--panel-raised); border:1px solid var(--gini-dim); border-left:3px solid var(--gini); width:min(82%, 640px); }
  .msg.system{ align-self:center; background:transparent; border:1px dashed var(--border); color:var(--text-dim); font-family:var(--mono); font-size:11.5px; letter-spacing:0.04em; text-align:center; }
  .msg.error{ align-self:center; background:rgba(255,92,92,0.08); border:1px solid var(--red); color:var(--red); font-family:var(--mono); font-size:11.5px; text-align:center; }

  .role-tag{ display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:10px; letter-spacing:0.1em; margin-bottom:6px; }
  .role-tag.mimo-tag{ color:var(--mimo); }
  .role-tag.gini-tag{ color:var(--gini); }

  .arch-text{ white-space:pre-wrap; }

  .stream-cursor{
    display:inline-block; width:7px; margin-left:1px;
    animation:blink 0.9s steps(1) infinite;
  }
  @keyframes blink{ 0%,49%{opacity:1;} 50%,100%{opacity:0;} }

  .thinking{ display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:12px; color:var(--text-dim); }
  .thinking .bar{ display:flex; gap:3px; }
  .thinking .bar span{ width:5px; height:5px; border-radius:50%; background:var(--mimo); animation:bounce 1.1s infinite ease-in-out; }
  .thinking .bar span:nth-child(2){ animation-delay:0.15s; }
  .thinking .bar span:nth-child(3){ animation-delay:0.3s; }
  @keyframes bounce{ 0%,60%,100%{ transform:translateY(0); opacity:0.4; } 30%{ transform:translateY(-4px); opacity:1; } }

  .clarify-card{
    align-self:flex-start; width:min(82%, 560px);
    background:
      linear-gradient(rgba(122,162,255,0.05), rgba(122,162,255,0.05)),
      repeating-linear-gradient(0deg, rgba(122,162,255,0.06) 0px, rgba(122,162,255,0.06) 1px, transparent 1px, transparent 18px),
      repeating-linear-gradient(90deg, rgba(122,162,255,0.06) 0px, rgba(122,162,255,0.06) 1px, transparent 1px, transparent 18px),
      var(--panel-raised);
    border:1px solid var(--mimo-dim);
    border-radius:8px;
    padding:16px;
  }

  .clarify-card .heading{ font-family:var(--mono); font-size:11px; color:var(--mimo); letter-spacing:0.08em; margin-bottom:12px; }

  .clarify-q{ margin-bottom:14px; }
  .clarify-q .q-text{ font-size:13.5px; margin-bottom:8px; }
  .opt-row{ display:flex; flex-wrap:wrap; gap:8px; }

  .opt-btn{
    font-family:var(--sans); font-size:13px; color:var(--text);
    background:var(--panel-raised-2); border:1px solid var(--border); border-radius:5px;
    padding:7px 12px; cursor:pointer; transition:all 0.15s ease;
  }
  .opt-btn:hover{ border-color:var(--mimo); }
  .opt-btn.selected{ background:var(--mimo-dim); border-color:var(--mimo); color:#fff; }

  .clarify-submit{
    margin-top:6px; font-family:var(--mono); font-size:11px; letter-spacing:0.08em; font-weight:700;
    background:var(--mimo); color:#0a1020; border:none; border-radius:5px; padding:9px 16px; cursor:pointer;
  }
  .clarify-submit:disabled{ opacity:0.35; cursor:not-allowed; }

  /* Generate button lives in its own flex row so alignment is predictable */
  .action-row{ display:flex; align-self:flex-start; }

  .code-panel{ align-self:flex-start; width:min(82%, 700px); border:1px solid var(--gini-dim); border-radius:8px; overflow:hidden; }

  .code-header{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--panel-raised-2); padding:8px 12px; border-bottom:1px solid var(--gini-dim);
    font-family:var(--mono); font-size:11px; color:var(--text-dim);
  }
  .code-header .code-title{ color:var(--gini); font-weight:700; letter-spacing:0.05em; }
  .code-actions{ display:flex; gap:8px; }
  .code-actions button{
    font-family:var(--mono); font-size:10.5px; letter-spacing:0.04em;
    background:transparent; border:1px solid var(--border); color:var(--text-dim);
    border-radius:4px; padding:4px 9px; cursor:pointer; transition:all 0.15s ease;
  }
  .code-actions button:hover{ border-color:var(--gini); color:var(--gini); }
  .code-actions button.copied{ border-color:var(--gini); color:var(--gini); }

  pre.code-body{
    margin:0; padding:14px; max-height:420px; overflow:auto;
    background:#0d1210; font-family:var(--mono); font-size:12.5px; line-height:1.55; color:#d6e8dc;
  }

  .generate-btn{
    align-self:flex-start; margin-top:2px;
    font-family:var(--mono); font-size:11.5px; letter-spacing:0.06em; font-weight:700;
    background:var(--gini); color:#06120c; border:none; border-radius:5px;
    padding:9px 16px; cursor:pointer;
  }
  .generate-btn:hover:not(:disabled){ opacity:0.85; }
  .generate-btn:disabled{ opacity:0.5; cursor:default; }

  footer{
    flex:0 0 auto;
    border-top:1px solid var(--border); background:var(--panel);
    padding:12px 16px;
    padding-bottom:calc(12px + env(safe-area-inset-bottom));
  }
  .composer{ display:flex; gap:10px; align-items:flex-end; }

  textarea{
    flex:1 1 auto; resize:none; min-height:44px; max-height:140px;
    background:var(--panel-raised); border:1px solid var(--border); border-radius:6px; color:var(--text);
    font-family:var(--sans); font-size:14.5px; padding:11px 12px; line-height:1.4;
  }
  textarea:focus{ outline:2px solid var(--mimo); outline-offset:1px; }

  button#send{
    flex:0 0 auto; background:var(--mimo); color:#08101f; border:none; border-radius:6px;
    font-family:var(--mono); font-weight:700; font-size:12px; letter-spacing:0.08em;
    padding:0 18px; height:44px; cursor:pointer; transition:opacity 0.15s ease;
  }
  button#send:disabled{ opacity:0.4; cursor:not-allowed; }
  button#send:not(:disabled):hover{ opacity:0.85; }
  button#send:focus-visible{ outline:2px solid var(--text); outline-offset:2px; }

  .hint{ font-family:var(--mono); font-size:10px; color:var(--text-dim); margin-top:6px; letter-spacing:0.04em; }

  main::-webkit-scrollbar{ width:8px; }
  main::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }

  @media (max-width:640px){
    .msg, .clarify-card, .code-panel{ max-width:94%; width:94%; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="title">TRANSMISSION</span>
    <span class="sub">MIMO + GINIAI · LIVE COLAB UPLINK</span>
  </div>
  <div class="status-row">
    <div class="chip" id="tunnelChip">
      <span class="dot searching" id="tunnelDot"></span>
      <div><span class="name">LINK</span><br><span class="role" id="tunnelText">searching</span></div>
    </div>
    <div class="chip" id="mimoChip">
      <span class="dot idle mimo-dot" id="mimoDot"></span>
      <div><span class="name" style="color:var(--mimo)">MIMO</span><br><span class="role" id="mimoStatusText">idle · architecture</span></div>
    </div>
    <div class="chip" id="giniChip">
      <span class="dot idle gini-dot" id="giniDot"></span>
      <div><span class="name" style="color:var(--gini)">GiniAi</span><br><span class="role" id="giniStatusText">idle · code</span></div>
    </div>
  </div>
</header>

<main id="log"></main>

<footer>
  <div class="composer">
    <textarea id="input" placeholder="Describe the website you want…" rows="1"></textarea>
    <button id="send">SEND</button>
  </div>
  <div class="hint" id="hint">Waiting for tunnel address…</div>
</footer>

<script>
/* =====================================================================
   CONFIG
   ===================================================================== */
const TUNNEL_JSON_URL = "https://spacklight.github.io/Tunnel/config/tunnel.json";
const TUNNEL_POLL_MS = 20000;
const STATUS_POLL_MS = 6000;
const MAX_CLARIFY_ROUNDS = 1;

// Extra formatting reminder injected client-side, since we're not editing
// the backend cell. Reinforces the JSON shape MIMO should use for
// clarifying questions, on top of whatever rule already lives server-side.
const MIMO_FORMAT_REMINDER =
  'Reminder: if you ask clarifying questions, use EXACTLY this shape and nothing else — ' +
  '<CLARIFY>{"questions":[{"question":"...","options":["...","..."]}]}</CLARIFY> — ' +
  'plain JSON inside the tags, no extra tags like <question1>, no text before or after, max 3 questions.\n\n';

const state = {
  tunnelUrl: null,
  tunnelState: "searching",
  originalRequest: null,
  lastArchitecture: null,
  clarifyRoundsUsed: 0,
};

const el = {
  log: document.getElementById("log"),
  input: document.getElementById("input"),
  send: document.getElementById("send"),
  hint: document.getElementById("hint"),
  tunnelDot: document.getElementById("tunnelDot"),
  tunnelText: document.getElementById("tunnelText"),
  mimoDot: document.getElementById("mimoDot"),
  mimoStatusText: document.getElementById("mimoStatusText"),
  giniDot: document.getElementById("giniDot"),
  giniStatusText: document.getElementById("giniStatusText"),
};

/* ---------- Status helpers ---------- */
function setTunnelState(s, note) {
  state.tunnelState = s;
  el.tunnelDot.className = "dot " + s;
  el.tunnelText.textContent = s;
  if (note) el.hint.textContent = note;
}

function setModelStatus(modelKey, working) {
  if (modelKey === "MIMO") {
    el.mimoDot.className = "dot mimo-dot " + (working ? "working" : "idle");
    el.mimoStatusText.textContent = (working ? "working" : "idle") + " · architecture";
  } else if (modelKey === "GiniAi") {
    el.giniDot.className = "dot gini-dot " + (working ? "working" : "idle");
    el.giniStatusText.textContent = (working ? "working" : "idle") + " · code";
  }
}

/* ---------- Message rendering ---------- */
function scrollDown() { el.log.scrollTop = el.log.scrollHeight; }

function addMessage(role, content) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;
  wrap.textContent = content;
  el.log.appendChild(wrap);
  scrollDown();
  return wrap;
}

/* ---------- Lenient CLARIFY parser ---------- */
function parseClarify(fullText) {
  const match = fullText.match(/<CLARIFY>([\s\S]*?)(?:<\/CLARIFY>|$)/);
  if (!match) return null;
  const raw = match[1].trim();

  try {
    const parsed = JSON.parse(raw);
    if (parsed.questions && parsed.questions.length) {
      return parsed.questions.slice(0, 3);
    }
  } catch (e) { /* fall through */ }

  const questions = [];
  const qRegex = /"([^"]{3,300}\?)"\s*[,:{]*\s*"options"\s*:\s*\[([^\]]*)\]/g;
  let m;
  while ((m = qRegex.exec(raw)) !== null) {
    const qText = m[1];
    const options = [...m[2].matchAll(/"([^"]+)"/g)].map(x => x[1]);
    if (qText && options.length) questions.push({ question: qText, options });
    if (questions.length >= 3) break;
  }
  return questions.length ? questions : null;
}

function stripClarifyArtifacts(text) {
  return text.replace(/<CLARIFY>[\s\S]*?(<\/CLARIFY>|$)/, "")
             .replace(/\{"questions"\s*:\s*\[[\s\S]*?\]\s*\}/g, "")
             .trim();
}

function renderClarifyCard(bubble, questions) {
  bubble.remove();

  const card = document.createElement("div");
  card.className = "clarify-card";

  const heading = document.createElement("div");
  heading.className = "heading";
  heading.textContent = "MIMO NEEDS A FEW DETAILS";
  card.appendChild(heading);

  const answers = new Array(questions.length).fill(null);

  questions.forEach((q, qi) => {
    const qWrap = document.createElement("div");
    qWrap.className = "clarify-q";

    const qText = document.createElement("div");
    qText.className = "q-text";
    qText.textContent = q.question;
    qWrap.appendChild(qText);

    const optRow = document.createElement("div");
    optRow.className = "opt-row";

    (q.options || []).forEach((opt) => {
      const optBtn = document.createElement("button");
      optBtn.className = "opt-btn";
      optBtn.textContent = opt;
      optBtn.addEventListener("click", () => {
        optRow.querySelectorAll(".opt-btn").forEach(b => b.classList.remove("selected"));
        optBtn.classList.add("selected");
        answers[qi] = opt;
        submitBtn.disabled = answers.some(a => a === null);
      });
      optRow.appendChild(optBtn);
    });

    qWrap.appendChild(optRow);
    card.appendChild(qWrap);
  });

  const submitBtn = document.createElement("button");
  submitBtn.className = "clarify-submit";
  submitBtn.textContent = "CONTINUE";
  submitBtn.disabled = true;
  submitBtn.addEventListener("click", () => {
    submitBtn.disabled = true;
    state.clarifyRoundsUsed += 1;
    const summary = questions.map((q, i) => `${q.question} ${answers[i]}`).join("\n");
    const followUp = `${state.originalRequest}\n\nAdditional details:\n${summary}`;
    addMessage("system", "Answers sent to MIMO.");
    requestArchitecture(followUp);
  });
  card.appendChild(submitBtn);

  el.log.appendChild(card);
  scrollDown();
}

function appendGenerateButton(architectureText) {
  const row = document.createElement("div");
  row.className = "action-row";

  const btn = document.createElement("button");
  btn.className = "generate-btn";
  btn.textContent = "GENERATE CODE WITH GINIAI →";

  btn.addEventListener("click", () => {
    console.log("[GiniAi] Generate button clicked");
    if (!state.tunnelUrl) {
      console.error("[GiniAi] No tunnel URL set — aborting");
      addMessage("error", "No live backend connection — can't generate code right now.");
      return;
    }
    btn.disabled = true;
    btn.textContent = "GENERATING…";
    try {
      requestCode(architectureText);
    } catch (err) {
      console.error("[GiniAi] requestCode threw synchronously:", err);
      addMessage("error", `Failed to start code generation: ${err.message}`);
      btn.disabled = false;
      btn.textContent = "GENERATE CODE WITH GINIAI →";
    }
  });

  row.appendChild(btn);
  el.log.appendChild(row);
  scrollDown();
}

function copyToClipboard(text, btn) {
  const markCopied = () => {
    btn.textContent = "COPIED";
    btn.classList.add("copied");
    setTimeout(() => { btn.textContent = "COPY CODE"; btn.classList.remove("copied"); }, 1500);
  };

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(markCopied).catch(() => fallbackCopy(text, markCopied));
  } else {
    fallbackCopy(text, markCopied);
  }
}

function fallbackCopy(text, onDone) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try {
    document.execCommand("copy");
    onDone();
  } catch (e) {
    console.error("[copy] fallback copy failed:", e);
  }
  document.body.removeChild(ta);
}

function createCodePanel() {
  const panel = document.createElement("div");
  panel.className = "code-panel";
  panel.innerHTML = `
    <div class="code-header">
      <span class="code-title">GiniAi — generating…</span>
      <div class="code-actions">
        <button class="copy-btn">COPY CODE</button>
        <button class="download-btn">DOWNLOAD</button>
      </div>
    </div>
    <pre class="code-body"><code></code></pre>
  `;
  el.log.appendChild(panel);
  scrollDown();

  const codeEl = panel.querySelector("code");
  const titleEl = panel.querySelector(".code-title");
  const copyBtn = panel.querySelector(".copy-btn");
  const downloadBtn = panel.querySelector(".download-btn");

  copyBtn.addEventListener("click", () => copyToClipboard(codeEl.textContent, copyBtn));

  downloadBtn.addEventListener("click", () => {
    const blob = new Blob([codeEl.textContent], { type: "text/plain" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "generated_site.html";
    a.click();
    URL.revokeObjectURL(url);
  });

  return { panel, codeEl, titleEl };
}

/* ---------- SSE streaming ---------- */
async function streamSSE(url, body, onEvent, onError) {
  console.log("[stream] starting request to", url);
  try {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    console.log("[stream] response status:", res.status);
    if (!res.ok || !res.body) {
      onError(`HTTP ${res.status}`);
      return;
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split("\n\n");
      buffer = parts.pop();
      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith("data:")) continue;
        const jsonStr = line.slice(5).trim();
        try {
          onEvent(JSON.parse(jsonStr));
        } catch (e) {
          console.warn("[stream] could not parse chunk:", jsonStr);
        }
      }
    }
    console.log("[stream] finished:", url);
  } catch (err) {
    console.error("[stream] fetch failed:", err);
    onError(err.message);
  }
}

/* ---------- MIMO request ---------- */
function requestArchitecture(promptText) {
  if (!state.tunnelUrl) {
    addMessage("error", "No live backend connection — message not sent.");
    return;
  }

  const allowClarify = state.clarifyRoundsUsed < MAX_CLARIFY_ROUNDS;
  let effectivePrompt = promptText;
  if (allowClarify) {
    effectivePrompt = MIMO_FORMAT_REMINDER + promptText;
  } else {
    effectivePrompt =
      "IMPORTANT: Do not ask any clarifying questions this time, even if something is ambiguous — " +
      "make a reasonable assumption and proceed directly to the full architecture explanation.\n\n" + promptText;
  }

  setModelStatus("MIMO", true);

  const bubble = document.createElement("div");
  bubble.className = "msg mimo";
  bubble.innerHTML = `<div class="role-tag mimo-tag">MIMO</div><div class="arch-text"><span class="stream-cursor">▍</span></div>`;
  el.log.appendChild(bubble);
  scrollDown();
  const textEl = bubble.querySelector(".arch-text");

  let fullText = "";
  let clarifyMode = false;

  streamSSE(
    state.tunnelUrl.replace(/\/$/, "") + "/architecture",
    { prompt: effectivePrompt },
    (evt) => {
      if (evt.event === "status") {
        setModelStatus(evt.model, evt.state === "working");
      } else if (evt.event === "token") {
        fullText += evt.text;

        if (allowClarify && !clarifyMode && fullText.includes("<CLARIFY>")) {
          clarifyMode = true;
          textEl.innerHTML = `<div class="thinking"><span>Reviewing what details are missing</span><div class="bar"><span></span><span></span><span></span></div></div>`;
        }

        if (!clarifyMode) {
          textEl.textContent = fullText;
          const cursor = document.createElement("span");
          cursor.className = "stream-cursor";
          cursor.textContent = "▍";
          textEl.appendChild(cursor);
        }
        scrollDown();
      } else if (evt.event === "error") {
        setModelStatus("MIMO", false);
        textEl.textContent = `Something went wrong: ${evt.message}`;
      } else if (evt.event === "done") {
        setModelStatus("MIMO", false);

        const questions = allowClarify ? parseClarify(fullText) : null;
        if (questions && questions.length) {
          state.clarifyRoundsUsed += 1;
          renderClarifyCard(bubble, questions);
          return;
        }

        let cleanText = stripClarifyArtifacts(fullText);
        if (!cleanText) {
          cleanText = "Proceeding with the details provided so far.";
        }
        state.lastArchitecture = cleanText;
        textEl.textContent = cleanText;
        appendGenerateButton(cleanText);
      }
    },
    (errMsg) => {
      setModelStatus("MIMO", false);
      textEl.textContent = `Something went wrong: ${errMsg}`;
    }
  );
}

/* ---------- GiniAi request ---------- */
function requestCode(architectureText) {
  console.log("[GiniAi] requestCode() called, tunnelUrl =", state.tunnelUrl);
  setModelStatus("GiniAi", true);
  const { panel, codeEl, titleEl } = createCodePanel();

  const prompt =
    `Website request: ${state.originalRequest}\n\n` +
    `Architecture plan:\n${architectureText}\n\n` +
    `Generate the complete code for this website.`;

  streamSSE(
    state.tunnelUrl.replace(/\/$/, "") + "/generate",
    { prompt },
    (evt) => {
      if (evt.event === "status") {
        setModelStatus(evt.model, evt.state === "working");
      } else if (evt.event === "token") {
        codeEl.textContent += evt.text;
        panel.querySelector(".code-body").scrollTop = panel.querySelector(".code-body").scrollHeight;
      } else if (evt.event === "error") {
        setModelStatus("GiniAi", false);
        titleEl.textContent = "GiniAi — failed";
        codeEl.textContent += `\n\n/* Error: ${evt.message} */`;
      } else if (evt.event === "done") {
        setModelStatus("GiniAi", false);
        titleEl.textContent = "GiniAi — generated_site.html";
      }
    },
    (errMsg) => {
      setModelStatus("GiniAi", false);
      titleEl.textContent = "GiniAi — failed";
      codeEl.textContent += `\n\n/* Error: ${errMsg} */`;
    }
  );
}

/* ---------- Tunnel discovery ---------- */
async function fetchTunnelUrl() {
  try {
    const res = await fetch(TUNNEL_JSON_URL + `?t=${Date.now()}`, { cache: "no-store" });
    if (!res.ok) throw new Error(`status ${res.status}`);
    const data = await res.json();
    if (!data.url) throw new Error("no url field");

    const changed = state.tunnelUrl !== null && data.url !== state.tunnelUrl;
    state.tunnelUrl = data.url;
    if (changed) addMessage("system", `Tunnel address updated: ${data.url}`);

    await pingBackend();
  } catch (err) {
    setTunnelState("offline", `Could not read tunnel.json (${err.message}).`);
  }
}

async function pingBackend() {
  if (!state.tunnelUrl) return;
  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 8000);
    const res = await fetch(state.tunnelUrl, { method: "GET", signal: controller.signal });
    clearTimeout(timeout);
    setTunnelState("online", `Connected: ${state.tunnelUrl}`);
  } catch (err) {
    setTunnelState("offline", "Tunnel address known but backend not responding yet. Retrying…");
  }
}

async function pollStatus() {
  if (!state.tunnelUrl || state.tunnelState !== "online") return;
  try {
    const res = await fetch(state.tunnelUrl.replace(/\/$/, "") + "/status");
    if (!res.ok) return;
    const data = await res.json();
    if (data.MIMO) setModelStatus("MIMO", data.MIMO === "working");
    if (data.GiniAi) setModelStatus("GiniAi", data.GiniAi === "working");
  } catch (err) { /* silent — heartbeat only */ }
}

/* ---------- Composer wiring ---------- */
function sendMessage() {
  const text = el.input.value.trim();
  if (!text) return;
  if (!state.tunnelUrl || state.tunnelState === "offline") {
    addMessage("error", "No live backend connection — message not sent.");
    return;
  }
  addMessage("user", text);
  state.originalRequest = text;
  state.clarifyRoundsUsed = 0;
  el.input.value = "";
  el.input.style.height = "auto";
  requestArchitecture(text);
}

el.send.addEventListener("click", sendMessage);
el.input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
el.input.addEventListener("input", () => {
  el.input.style.height = "auto";
  el.input.style.height = Math.min(el.input.scrollHeight, 140) + "px";
});

/* ---------- Boot ---------- */
addMessage("system", "Waiting for tunnel address from GitHub Pages…");
fetchTunnelUrl();
setInterval(fetchTunnelUrl, TUNNEL_POLL_MS);
setInterval(pollStatus, STATUS_POLL_MS);
</script>
