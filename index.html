<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gini AI - Smart Coding Assistant</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg-primary: #0f1117; --bg-secondary: #1a1d24; --bg-tertiary: #252830;
            --text-primary: #e6e6e6; --text-secondary: #a0a0a0; --accent: #6366f1;
            --accent-hover: #4f46e5; --thinking-bg: #1e1b4b; --thinking-border: #4338ca;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-primary); height: 100vh; display: flex; flex-direction: column; }
        header { padding: 1rem 2rem; background: var(--bg-secondary); border-bottom: 1px solid var(--bg-tertiary); display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 0.5rem; }
        .settings-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 1.2rem; }
        #chat-container { flex: 1; overflow-y: auto; padding: 2rem; display: flex; flex-direction: column; gap: 1.5rem; max-width: 900px; width: 100%; margin: 0 auto; }
        .message { display: flex; gap: 1rem; animation: fadeIn 0.3s ease; }
        .message.user { flex-direction: row-reverse; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; }
        .message.ai .avatar { background: var(--accent); color: white; }
        .message.user .avatar { background: var(--bg-tertiary); color: var(--text-primary); }
        .message-content { background: var(--bg-secondary); padding: 1rem 1.25rem; border-radius: 12px; border-top-left-radius: 4px; max-width: 85%; line-height: 1.6; font-size: 0.95rem; }
        .message.user .message-content { background: var(--accent); color: white; border-top-left-radius: 12px; border-top-right-radius: 4px; }
        .thinking-block { background: var(--thinking-bg); border: 1px solid var(--thinking-border); border-radius: 8px; margin-bottom: 1rem; overflow: hidden; }
        .thinking-header { padding: 0.75rem 1rem; background: rgba(67, 56, 202, 0.2); cursor: pointer; display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: #a5b4fc; font-weight: 600; user-select: none; }
        .thinking-header:hover { background: rgba(67, 56, 202, 0.3); }
        .thinking-content { padding: 1rem; font-size: 0.85rem; color: #c7d2fe; border-top: 1px solid var(--thinking-border); display: none; white-space: pre-wrap; font-family: 'Courier New', monospace; }
        .thinking-content.visible { display: block; }
        .thinking-spinner { animation: spin 1s linear infinite; }
        .code-wrapper { position: relative; margin: 1rem 0; border-radius: 8px; overflow: hidden; background: #282c34; }
        .code-header { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 1rem; background: #21252b; color: #abb2bf; font-size: 0.8rem; font-family: monospace; }
        .copy-btn { background: transparent; border: 1px solid #4b5263; color: #abb2bf; padding: 0.25rem 0.75rem; border-radius: 4px; cursor: pointer; font-size: 0.75rem; display: flex; align-items: center; gap: 0.25rem; transition: all 0.2s; }
        .copy-btn:hover { background: #4b5263; color: white; }
        .copy-btn.copied { background: #2ea043; border-color: #2ea043; color: white; }
        pre { margin: 0; padding: 1rem; overflow-x: auto; }
        code { font-family: 'Fira Code', 'Consolas', monospace; font-size: 0.9rem; }
        .input-area { padding: 1.5rem 2rem; background: var(--bg-secondary); border-top: 1px solid var(--bg-tertiary); }
        .input-wrapper { max-width: 900px; margin: 0 auto; position: relative; display: flex; gap: 0.75rem; }
        #user-input { flex: 1; background: var(--bg-primary); border: 1px solid var(--bg-tertiary); color: var(--text-primary); padding: 1rem 1.25rem; border-radius: 12px; font-size: 1rem; resize: none; height: 56px; outline: none; transition: border-color 0.2s; }
        #user-input:focus { border-color: var(--accent); }
        #send-btn { background: var(--accent); color: white; border: none; width: 56px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; transition: background 0.2s; }
        #send-btn:hover { background: var(--accent-hover); }
        #send-btn:disabled { background: var(--bg-tertiary); color: var(--text-secondary); cursor: not-allowed; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; z-index: 1000; }
        .modal.active { display: flex; }
        .modal-content { background: var(--bg-secondary); padding: 2rem; border-radius: 12px; width: 90%; max-width: 500px; }
        .modal-content h3 { margin-bottom: 1rem; }
        .modal-content input { width: 100%; padding: 0.75rem; background: var(--bg-primary); border: 1px solid var(--bg-tertiary); color: var(--text-primary); border-radius: 8px; margin-bottom: 1rem; outline: none; }
        .modal-content button { background: var(--accent); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; cursor: pointer; font-weight: 600; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .message-content p { margin-bottom: 0.75rem; }
        .message-content p:last-child { margin-bottom: 0; }
        .message-content ul, .message-content ol { margin-left: 1.5rem; margin-bottom: 0.75rem; }
    </style>
</head>
<body>
<header>
    <div class="logo"><i class="ph ph-robot"></i> Gini AI</div>
    <button class="settings-btn" onclick="toggleSettings()"><i class="ph ph-gear"></i></button>
</header>

<div id="chat-container">
    <div class="message ai">
        <div class="avatar"><i class="ph ph-robot"></i></div>
        <div class="message-content">Hello! I'm Gini AI, your smart coding assistant. I can think through complex problems and generate clean, highlighted code. Ask me anything!</div>
    </div>
</div>

<div class="input-area">
    <div class="input-wrapper">
        <textarea id="user-input" placeholder="Ask me anything to get started..." onkeydown="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); }"></textarea>
        <button id="send-btn" onclick="sendMessage()"><i class="ph ph-paper-plane-right"></i></button>
    </div>
</div>

<div id="settings-modal" class="modal">
    <div class="modal-content">
        <h3>Backend Settings</h3>
        <p style="color: var(--text-secondary); margin-bottom: 0.5rem; font-size: 0.9rem;">Enter your Cloudflare Tunnel URL:</p>
        <input type="text" id="backend-url" placeholder="https://your-tunnel.trycloudflare.com">
        <button onclick="saveSettings()">Save & Connect</button>
    </div>
</div>

<script>
    marked.setOptions({
        highlight: function(code, lang) {
            const language = hljs.getLanguage(lang) ? lang : 'plaintext';
            return hljs.highlight(code, { language }).value;
        },
        langPrefix: 'hljs language-'
    });

    const renderer = new marked.Renderer();
    renderer.code = function(code, language) {
        const lang = language || 'plaintext';
        const validLang = hljs.getLanguage(lang) ? lang : 'plaintext';
        const highlighted = hljs.highlight(code, { language: validLang }).value;
        return `
        <div class="code-wrapper">
            <div class="code-header">
                <span>${lang}</span>
                <button class="copy-btn" onclick="copyCode(this)">
                    <i class="ph ph-copy"></i> Copy
                </button>
            </div>
            <pre><code class="hljs language-${validLang}">${highlighted}</code></pre>
        </div>`;
    };
    marked.use({ renderer });

    let backendUrl = localStorage.getItem('gini_backend_url') || '';

    function toggleSettings() {
        document.getElementById('settings-modal').classList.toggle('active');
        document.getElementById('backend-url').value = backendUrl;
    }

    function saveSettings() {
        let url = document.getElementById('backend-url').value.trim();
        // Clean up the URL: remove trailing slashes
        backendUrl = url.replace(/\/+$/, '');
        localStorage.setItem('gini_backend_url', backendUrl);
        toggleSettings();
        alert('Backend URL saved!');
    }

    function copyCode(btn) {
        const code = btn.closest('.code-wrapper').querySelector('code').innerText;
        navigator.clipboard.writeText(code).then(() => {
            btn.innerHTML = '<i class="ph ph-check"></i> Copied!';
            btn.classList.add('copied');
            setTimeout(() => {
                btn.innerHTML = '<i class="ph ph-copy"></i> Copy';
                btn.classList.remove('copied');
            }, 2000);
        });
    }

    function appendMessage(role, text, thinking) {
        const container = document.getElementById('chat-container');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role}`;

        let contentHtml = '';
        if (thinking) {
            contentHtml += `
            <div class="thinking-block">
                <div class="thinking-header" onclick="this.nextElementSibling.classList.toggle('visible')">
                    <i class="ph ph-brain thinking-spinner"></i>
                    <span>Thinking process...</span>
                    <i class="ph ph-caret-down" style="margin-left: auto;"></i>
                </div>
                <div class="thinking-content visible">${thinking}</div>
            </div>`;
        }
        contentHtml += `<div>${marked.parse(text)}</div>`;

        msgDiv.innerHTML = `
            <div class="avatar"><i class="ph ph-${role === 'user' ? 'user' : 'robot'}"></i></div>
            <div class="message-content">${contentHtml}</div>
        `;
        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
    }

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const text = input.value.trim();

        if (!text) return;
        if (!backendUrl) {
            alert('Please set your Backend URL in Settings (⚙️) first!');
            toggleSettings();
            return;
        }

        input.value = '';
        sendBtn.disabled = true;
        appendMessage('user', text);

        const container = document.getElementById('chat-container');
        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'message ai';
        loadingDiv.innerHTML = `
            <div class="avatar"><i class="ph ph-robot"></i></div>
            <div class="message-content">
                <div class="thinking-block">
                    <div class="thinking-header">
                        <i class="ph ph-brain thinking-spinner"></i>
                        <span>Analyzing and thinking...</span>
                    </div>
                </div>
            </div>
        `;
        container.appendChild(loadingDiv);
        container.scrollTop = container.scrollHeight;

        try {
            const targetUrl = `${backendUrl}/chat`;
            console.log("Attempting to fetch:", targetUrl); // Debug log
            
            const response = await fetch(targetUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });

            if (!response.ok) {
                throw new Error(`Server responded with ${response.status}`);
            }

            const data = await response.json();
            loadingDiv.remove();
            appendMessage('ai', data.response, data.thinking);
        } catch (error) {
            loadingDiv.remove();
            appendMessage('ai', `❌ **Error connecting to backend:** ${error.message}\n\n**Debug Info:**\n- Are you sure the Colab cell is still running?\n- Is the URL in Settings exactly like this: \`https://xxxx.trycloudflare.com\` (no trailing slash)?\n- Try opening the Settings and re-saving the URL.`);
        } finally {
            sendBtn.disabled = false;
            input.focus();
        }
    }
</script>
</body>
</html>
